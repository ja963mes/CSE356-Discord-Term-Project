# Local dev dependencies: Postgres + Redis + Cassandra.
# Run apps on the host: `npm run dev:all` (or individual `npm run dev:*`).
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# Postgres is published on host port 5433 by default so it does not conflict
# with a local PostgreSQL on 5432 (common on macOS/Homebrew). Override with
# POSTGRES_PORT in `.env` (e.g. POSTGRES_PORT=5432) and match DATABASE_URL.
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-clone-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456789"
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: discord-clone-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  cassandra:
    image: cassandra:4.0
    container_name: discord-clone-cassandra
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: discord-clone-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: discord-clone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  elasticsearch_data:
  minio_data:
