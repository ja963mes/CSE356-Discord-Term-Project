# Local dev dependencies: Postgres + Redis + Cassandra.
# Run apps on the host: `npm run dev:all` (or individual `npm run dev:*`).
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# Postgres is published on host port 5433 by default so it does not conflict
# with a local PostgreSQL on 5432 (common on macOS/Homebrew). Override with
# POSTGRES_PORT in `.env` (e.g. POSTGRES_PORT=5432) and match DATABASE_URL_DIRECT.
#
# PgBouncer (optional, recommended for many Node pools): published on host
# PGBOUNCER_PORT (default 6432). Point app DATABASE_URL at localhost:6432;
# keep DATABASE_URL_DIRECT at localhost:5433 for drizzle-kit migrate and admin.
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-clone-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123456789}"
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: discord-clone-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-123456789}@postgres:5432/auth_db
      # Plain password in userlist so PgBouncer can SCRAM-auth to Postgres 14+; clients use SCRAM too.
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-1000}"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-20}"
      MIN_POOL_SIZE: "${PGBOUNCER_MIN_POOL_SIZE:-5}"
      RESERVE_POOL_SIZE: "${PGBOUNCER_RESERVE_POOL_SIZE:-5}"
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"

  redis:
    image: redis:7-alpine
    container_name: discord-clone-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

#  cassandra:
#    image: cassandra:4.0
#    container_name: discord-clone-cassandra
#    ports:
#      - "${CASSANDRA_PORT:-9042}:9042"
#    # Cap JVM heap so staging fits on small VMs (heap is the main RSS driver; add ~300–500MB for off-heap).
#    # Override on the host: CASSANDRA_MAX_HEAP=768M docker compose up -d cassandra
#    environment:
#      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-512M}
#      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEW:-128M}
#    mem_limit: ${CASSANDRA_MEM_LIMIT:-512m}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: discord-clone-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    mem_limit: ${ELASTICSEARCH_MEM_LIMIT:-768m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: discord-clone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  zabbix-postgres:
    profiles: ["monitoring"]
    image: postgres:16-alpine
    container_name: discord-clone-zabbix-postgres
    ports:
      - "${ZABBIX_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: "${ZABBIX_DB_USER:-zabbix}"
      POSTGRES_PASSWORD: "${ZABBIX_DB_PASSWORD:-zabbixpass}"
      POSTGRES_DB: "${ZABBIX_DB_NAME:-zabbix}"
    volumes:
      - zabbix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix} -d ${ZABBIX_DB_NAME:-zabbix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zabbix-server:
    profiles: ["monitoring"]
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: discord-clone-zabbix-server
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: "${ZABBIX_DB_USER:-zabbix}"
      POSTGRES_PASSWORD: "${ZABBIX_DB_PASSWORD:-zabbixpass}"
      POSTGRES_DB: "${ZABBIX_DB_NAME:-zabbix}"
      ZBX_CACHESIZE: "${ZABBIX_CACHE_SIZE:-64M}"
      ZBX_HISTORYCACHESIZE: "${ZABBIX_HISTORY_CACHE_SIZE:-32M}"
      ZBX_STARTPOLLERS: "${ZABBIX_START_POLLERS:-10}"
      ZBX_TIMEOUT: "${ZABBIX_TIMEOUT:-10}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zabbix_server_alertscripts:/usr/lib/zabbix/alertscripts
      - zabbix_server_externalscripts:/usr/lib/zabbix/externalscripts

  zabbix-web:
    profiles: ["monitoring"]
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: discord-clone-zabbix-web
    depends_on:
      zabbix-postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    ports:
      - "${ZABBIX_WEB_PORT:-8081}:8080"
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: "${ZABBIX_DB_USER:-zabbix}"
      POSTGRES_PASSWORD: "${ZABBIX_DB_PASSWORD:-zabbixpass}"
      POSTGRES_DB: "${ZABBIX_DB_NAME:-zabbix}"
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: "${ZABBIX_TIMEZONE:-America/New_York}"

  zabbix-agent:
    profiles: ["monitoring"]
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: discord-clone-zabbix-agent
    depends_on:
      zabbix-server:
        condition: service_started
    ports:
      - "${ZABBIX_AGENT_PORT:-10050}:10050"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: "${ZABBIX_AGENT_HOSTNAME:-discord-compose-agent}"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  redis_data:
#  cassandra_data:
  elasticsearch_data:
  minio_data:
  zabbix_postgres_data:
  zabbix_server_alertscripts:
  zabbix_server_externalscripts:
