<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Service</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { width: 400px; }
    .card { background: #16213e; border-radius: 12px; padding: 32px; margin-bottom: 20px; }
    h1 { text-align: center; margin-bottom: 24px; font-size: 24px; }
    .tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #0f3460; }
    .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab.active { color: #e94560; border-bottom-color: #e94560; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #0f3460; border-radius: 8px; background: #1a1a2e; color: #eee; font-size: 14px; outline: none; }
    input:focus { border-color: #e94560; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-primary:hover { background: #c73550; }
    .divider { display: flex; align-items: center; margin: 20px 0; color: #555; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid #0f3460; }
    .divider span { padding: 0 12px; }
    .oauth-buttons { display: flex; flex-direction: column; gap: 10px; }
    .btn-oauth { display: flex; align-items: center; justify-content: center; gap: 10px; background: #0f3460; color: #eee; border: 1px solid #1a4080; }
    .btn-oauth:hover { background: #1a4080; }
    .btn-google { border-color: #4285f4; }
    .btn-github { border-color: #6e5494; }
    .btn-oidc { border-color: #f0ad4e; }
    .message { padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
    .message.error { display: block; background: rgba(233,69,96,0.15); color: #e94560; border: 1px solid rgba(233,69,96,0.3); }
    .message.success { display: block; background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
    .pending-banner { background: #0f3460; border-radius: 8px; padding: 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; display: none; }
    .pending-banner .actions { display: flex; gap: 10px; margin-top: 12px; }
    .pending-banner button { width: auto; padding: 8px 16px; font-size: 13px; }
    .btn-link { background: #1a4080; color: #eee; border: 1px solid #1a4080; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Auth Service</h1>

      <div id="pendingBanner" class="pending-banner">
        <strong>OAuth sign-in detected.</strong> Choose an option:
        <div class="actions">
          <button class="btn-primary" onclick="showPendingForm('create')">Create New Account</button>
          <button class="btn-link" onclick="showPendingForm('link')">Link to Existing Account</button>
        </div>
        <div id="pendingForm" style="margin-top:12px; display:none;"></div>
      </div>

      <div id="msg" class="message"></div>

      <div id="authForms">
        <div class="tabs">
          <div class="tab active" data-tab="login" onclick="switchTab('login')">Sign In</div>
          <div class="tab" data-tab="register" onclick="switchTab('register')">Sign Up</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginUser">Username</label>
            <input id="loginUser" type="text" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="loginPass">Password</label>
            <input id="loginPass" type="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="regUser">Username</label>
            <input id="regUser" type="text" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="regPass">Password</label>
            <input id="regPass" type="password" required minlength="6" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="regDisplay">Display Name (optional)</label>
            <input id="regDisplay" type="text" autocomplete="name">
          </div>
          <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="divider"><span>or sign in with</span></div>

        <div class="oauth-buttons">
          <button class="btn-oauth btn-google" onclick="location.href='/auth/google'">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button class="btn-oauth btn-github" onclick="location.href='/auth/github'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </button>
          <button class="btn-oauth btn-oidc" onclick="location.href='/auth/oidc'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#f0ad4e"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Course (CSE 356)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let oauthTempToken = null;

    // Check for OAuth pending token in URL
    (function checkPending() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (token && window.location.pathname === '/auth/oauth/pending') {
        oauthTempToken = token;
        document.getElementById('pendingBanner').style.display = 'block';
        document.getElementById('authForms').style.display = 'none';
        window.history.replaceState({}, '', '/login.html');
      }
    })();

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      clearMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function clearMsg() {
      const el = document.getElementById('msg');
      el.className = 'message';
      el.textContent = '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearMsg();
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;

      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (res.ok) {
        showMsg('Signed in! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/', 1000);
      } else {
        showMsg(data.error || 'Login failed', 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearMsg();
      const username = document.getElementById('regUser').value;
      const password = document.getElementById('regPass').value;
      const displayName = document.getElementById('regDisplay').value || undefined;

      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, displayName }),
      });
      const data = await res.json();

      if (res.ok) {
        showMsg('Account created! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/', 1000);
      } else {
        showMsg(data.error || 'Registration failed', 'error');
      }
    }

    function showPendingForm(action) {
      const container = document.getElementById('pendingForm');
      container.style.display = 'block';

      if (action === 'create') {
        container.innerHTML = `
          <form onsubmit="handleOAuthComplete(event, 'create')">
            <div class="form-group"><label>Choose a username</label><input id="oauthUser" required></div>
            <div class="form-group"><label>Password (optional, for direct login later)</label><input id="oauthPass" type="password"></div>
            <button type="submit" class="btn-primary" style="margin-top:8px">Create Account</button>
          </form>`;
      } else {
        container.innerHTML = `
          <form onsubmit="handleOAuthComplete(event, 'link')">
            <div class="form-group"><label>Existing username</label><input id="oauthUser" required></div>
            <div class="form-group"><label>Password</label><input id="oauthPass" type="password" required></div>
            <button type="submit" class="btn-primary" style="margin-top:8px">Link Account</button>
          </form>`;
      }
    }

    async function handleOAuthComplete(e, action) {
      e.preventDefault();
      clearMsg();
      const username = document.getElementById('oauthUser').value;
      const password = document.getElementById('oauthPass').value || undefined;

      const res = await fetch('/auth/oauth/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ temp_token: oauthTempToken, action, username, password }),
      });
      const data = await res.json();

      if (res.ok) {
        showMsg(data.message + ' Redirecting...', 'success');
        setTimeout(() => window.location.href = '/', 1000);
      } else {
        showMsg(data.error || 'Failed', 'error');
      }
    }
  </script>
</body>
</html>
