<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    * { margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .card { background: #16213e; border-radius: 12px; padding: 48px; text-align: center; }
    h1 { font-size: 36px; margin-bottom: 12px; }
    p { color: #aaa; margin-bottom: 24px; }
    button { padding: 10px 24px; border: none; border-radius: 8px; background: #e94560; color: #fff; font-size: 14px; cursor: pointer; }
    button:hover { background: #c73550; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hooray, you logged in!</h1>
    <p>Your session is active.</p>
    <button onclick="logout()">Log Out</button>
  </div>
  <script>
    async function logout() {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
