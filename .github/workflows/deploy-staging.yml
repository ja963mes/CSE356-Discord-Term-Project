# Deploy to split frontend/backend VMs with Ansible.
#
# Required repo secrets:
#   BACKEND_SSH_HOST
#   FRONTEND_SSH_HOST
#   DEPLOY_SSH_USER
#   BACKEND_SSH_PRIVATE_KEY
#   FRONTEND_SSH_PRIVATE_KEY
#   DEPLOY_PATH
# Recommended:
#   SSH_KNOWN_HOSTS  → output of: ssh-keyscan -H YOUR_IP (both hosts)
# Optional:
#   DEPLOY_BRANCH    → defaults to main-dev if unset (set secret to override)
#   FRONTEND_WEB_ROOT → defaults to /var/www/discord-frontend
#   REPO_URL         → defaults to this repository URL
#
# The `deploy` user on each server needs: git pull in DEPLOY_PATH, npm, and
# passwordless sudo for systemctl restart/reload (see docs/STAGING-ROLLOUT.md).
#
# Backend includes `discord-search` (Elasticsearch: message search + community directory
# reindex on startup). Elasticsearch must be running before search (e.g. docker compose).
# `discord-communities` proxies GET /search-communities to search — restart search with backend.
name: CI and deploy staging

on:
  push:
    branches: [main-dev]
  pull_request:
    branches: [main-dev]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace frontend

  deploy_backend:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main-dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip3 install ansible

      - name: Configure SSH key (backend)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.BACKEND_SSH_PRIVATE_KEY }}" > ~/.ssh/id_backend
          chmod 600 ~/.ssh/id_backend
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          fi

      - name: Generate Ansible inventory and vars (backend)
        run: |
          set -euo pipefail
          BRANCH='${{ secrets.DEPLOY_BRANCH }}'
          if [ -z "$BRANCH" ]; then BRANCH=main-dev; fi
          REPO='${{ secrets.REPO_URL }}'
          if [ -z "$REPO" ]; then REPO=https://github.com/ja963mes/CSE356-Discord-Term-Project.git; fi
          WEB_ROOT='${{ secrets.FRONTEND_WEB_ROOT }}'
          if [ -z "$WEB_ROOT" ]; then WEB_ROOT=/var/www/discord-frontend; fi

          cat > ansible/inventory/hosts.ini <<EOF
          [backend]
          backend-vm ansible_host=${{ secrets.BACKEND_SSH_HOST }} ansible_user=${{ secrets.DEPLOY_SSH_USER }} ansible_ssh_private_key_file=~/.ssh/id_backend
          EOF

          cat > ansible/group_vars/all.yml <<EOF
          repo_url: "$REPO"
          deploy_branch: "$BRANCH"
          deploy_user: "${{ secrets.DEPLOY_SSH_USER }}"
          deploy_path: "${{ secrets.DEPLOY_PATH }}"
          frontend_web_root: "$WEB_ROOT"
          frontend_nginx_conf_src: "../docs/nginx/production-frontend.conf.example"
          backend_nginx_conf_src: "../docs/nginx/production-backend.conf.example"
          backend_systemd_services:
            - discord-auth
            - discord-search
            - discord-communities
            - discord-create-community
            - discord-messages
            - discord-realtime
            - discord-realtime-2
            - discord-dms
            - discord-read-state
          EOF

      - name: Deploy backend via Ansible
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/site.yml --limit backend

  deploy_frontend:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main-dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip3 install ansible

      - name: Configure SSH key (frontend)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}" > ~/.ssh/id_frontend
          chmod 600 ~/.ssh/id_frontend
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          fi

      - name: Generate Ansible inventory and vars (frontend)
        run: |
          set -euo pipefail
          BRANCH='${{ secrets.DEPLOY_BRANCH }}'
          if [ -z "$BRANCH" ]; then BRANCH=main-dev; fi
          REPO='${{ secrets.REPO_URL }}'
          if [ -z "$REPO" ]; then REPO=https://github.com/ja963mes/CSE356-Discord-Term-Project.git; fi
          WEB_ROOT='${{ secrets.FRONTEND_WEB_ROOT }}'
          if [ -z "$WEB_ROOT" ]; then WEB_ROOT=/var/www/discord-frontend; fi

          cat > ansible/inventory/hosts.ini <<EOF
          [frontend]
          frontend-vm ansible_host=${{ secrets.FRONTEND_SSH_HOST }} ansible_user=${{ secrets.DEPLOY_SSH_USER }} ansible_ssh_private_key_file=~/.ssh/id_frontend
          EOF

          cat > ansible/group_vars/all.yml <<EOF
          repo_url: "$REPO"
          deploy_branch: "$BRANCH"
          deploy_user: "${{ secrets.DEPLOY_SSH_USER }}"
          deploy_path: "${{ secrets.DEPLOY_PATH }}"
          frontend_web_root: "$WEB_ROOT"
          frontend_nginx_conf_src: "../docs/nginx/production-frontend.conf.example"
          backend_nginx_conf_src: "../docs/nginx/production-backend.conf.example"
          backend_systemd_services:
            - discord-auth
            - discord-search
            - discord-communities
            - discord-create-community
            - discord-messages
            - discord-realtime
            - discord-realtime-2
            - discord-dms
            - discord-read-state
          EOF

      - name: Deploy frontend via Ansible
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/site.yml --limit frontend
