# Deploy to split frontend/backend VMs over SSH.
#
# Required repo secrets:
#   BACKEND_SSH_HOST, BACKEND_SSH_PRIVATE_KEY
#   FRONTEND_SSH_HOST, FRONTEND_SSH_PRIVATE_KEY
#   DEPLOY_SSH_USER
#   DEPLOY_PATH
# Recommended:
#   SSH_KNOWN_HOSTS  → output of: ssh-keyscan -H YOUR_IP
# Optional:
#   DEPLOY_BRANCH    → defaults to main-dev if unset (set secret to override)
#   FRONTEND_WEB_ROOT → defaults to /var/www/discord-frontend
#
# The `deploy` user on each server needs: git pull in DEPLOY_PATH, npm, and
# passwordless sudo for systemctl restart/reload (see docs/STAGING-ROLLOUT.md).
# Add `sudo systemctl restart discord-read-state` below if that unit exists on the host.

name: CI and deploy staging

on:
  push:
    branches: [main-dev]
  pull_request:
    branches: [main-dev]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace frontend

  deploy_backend:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main-dev')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend services over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            BRANCH='${{ secrets.DEPLOY_BRANCH }}'
            if [ -z "$BRANCH" ]; then BRANCH=main-dev; fi
            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            npm ci
            npm run build --workspace auth-service
            npm run build --workspace communities-service
            npm run build --workspace create-community-service
            npm run build --workspace messages-service
            npm run build --workspace realtime-service
            npm run build --workspace dms-service
            npm run build --workspace read-state-service
            sudo systemctl restart discord-auth discord-communities discord-create-community discord-messages discord-realtime discord-realtime-2 discord-dms
            sudo systemctl reload nginx

  deploy_frontend:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main-dev')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend static assets over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            BRANCH='${{ secrets.DEPLOY_BRANCH }}'
            if [ -z "$BRANCH" ]; then BRANCH=main-dev; fi
            WEB_ROOT='${{ secrets.FRONTEND_WEB_ROOT }}'
            if [ -z "$WEB_ROOT" ]; then WEB_ROOT=/var/www/discord-frontend; fi
            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            npm ci
            npm run build --workspace frontend
            sudo mkdir -p "$WEB_ROOT"
            sudo rsync -a --delete ./frontend/dist/ "$WEB_ROOT"/
            sudo chown -R root:www-data "$WEB_ROOT"
            sudo chmod -R g+rX "$WEB_ROOT"
            sudo systemctl reload nginx
