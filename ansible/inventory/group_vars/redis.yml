# Redis VM (10.0.3.49, 4 vCPU). Runs four single-threaded redis-server
# instances on the same VM so all four cores are utilized:
#   - redis-pubsub  on :6379  → pubsub channels (channel:events, dm:events,
#     community:events, dm:userfeed:*, presence:broadcast)
#   - redis-pubsub2 on :6381  → second pubsub shard (same channel set)
#   - redis-kv      on :6380  → sessions (session:*), OAuth state
#     (oauth_state:*, oauth_temp:*), cache (comm:e:*, comm:c:*),
#     presence state (presence:*), DM pending hints (dm:pending:*),
#     realtime instance registry (realtime:instances)
#   - redis-kv2     on :6382  → second kv shard (same key set)
#
# NOTE: client-side sharding/routing is NOT yet wired. Services still point
# at :6379 / :6380 only. Adding the second pair gives capacity headroom on
# the box; routing must be added in service code (or via a proxy) before
# load actually spreads across pubsub/pubsub2 and kv/kv2.
#
# Per-instance config: bind, protected_mode shared; maxmemory + eviction
# policy tuned to the workload.
redis_version: "6:7.4.8-1rl1~jammy1"
redis_bind: "0.0.0.0"
redis_protected_mode: "no"

redis_instances:
  - name: pubsub
    port: 6379
    maxmemory: "1gb"
    # Pubsub holds no durable data — losing keys under memory pressure is fine.
    maxmemory_policy: "allkeys-lru"
    # Hard-limit subscriber output buffers: disconnect slow consumers at 32mb
    # (or 8mb sustained for 10s) before they can exhaust VM RAM and trigger OOM.
    client_output_buffer_limit: "pubsub 32mb 8mb 10"
  - name: pubsub2
    port: 6381
    maxmemory: "1gb"
    maxmemory_policy: "allkeys-lru"
    client_output_buffer_limit: "pubsub 32mb 8mb 10"
  - name: kv
    port: 6380
    maxmemory: "2gb"
    # volatile-lru only evicts keys with a TTL, so untagged session writes are
    # still safe from silent drops, but the instance no longer hard-OOMs writes
    # cluster-wide when it fills up. Switched away from noeviction after the
    # 2026-05-08 cascade where kv2's OOM crashed every realtime instance.
    maxmemory_policy: "volatile-lru"
  - name: kv2
    port: 6382
    # Bumped 2gb -> 4gb after kv2 peaked at 8.75g of client-buffer memory
    # during the 2026-05-08 cascade; the VM has 15g RAM so headroom is fine.
    maxmemory: "4gb"
    # kv2 holds only re-derivable cache (presence:*, comm:e:*, comm:c:*,
    # dm:pending:*) — evict cold keys instead of refusing writes. noeviction
    # here is what triggered the OOM-command cascade.
    maxmemory_policy: "allkeys-lru"

# Zabbix agent2 Redis-plugin sessions — one per local instance. Items poll via
# `redis.info[<section>,<session>]` (e.g. redis.info[Server,kv2],
# redis.info[Stats,pubsub]) and `redis.config[*,<session>]` for maxmemory etc.
# Loopback so traffic never leaves the VM.
zabbix_agent_redis_sessions:
  - name: pubsub
    uri: "tcp://127.0.0.1:6379"
  - name: pubsub2
    uri: "tcp://127.0.0.1:6381"
  - name: kv
    uri: "tcp://127.0.0.1:6380"
  - name: kv2
    uri: "tcp://127.0.0.1:6382"
