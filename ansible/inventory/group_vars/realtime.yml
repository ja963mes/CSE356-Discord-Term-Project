# Realtime VM (both instances). Hosts must be in [realtime] inventory group.
# Used by the realtime Ansible role (see roles/realtime).
realtime_systemd_services:
  - discord-realtime
  - discord-realtime-2
  - discord-realtime-3
  - discord-realtime-4

realtime_workspace_build_commands:
  - npm run build --workspace @discord/pubsub
  - npm run build --workspace realtime-service

realtime_nginx_conf_src: "{{ deploy_path }}/docs/nginx/production-realtime.conf.example"

realtime_log_level: info

realtime_database_url: "postgresql://postgres:123456789@10.0.2.247:6432/auth_db"
realtime_database_url_direct: "postgresql://postgres:123456789@10.0.2.247:5433/auth_db"
realtime_redis_url: "redis://10.0.3.49:6379"
# pubsub2 (port 6381) — community:events sub + presence:broadcast pub/sub.
realtime_meta_redis_url: "redis://10.0.3.49:6381"
# kv (port 6380) — sessions, realtime:instances registry.
realtime_kv_redis_url: "redis://10.0.3.49:6380"
# kv2 (port 6382) — presence:* + dm:pending:* drain.
realtime_kv_cache_redis_url: "redis://10.0.3.49:6382"
realtime_cassandra_contact_points: "10.0.2.111,10.0.0.225,10.0.1.200"
realtime_cassandra_port: "9042"
realtime_cassandra_local_datacenter: "datacenter1"
realtime_cassandra_keyspace: "messaging"
