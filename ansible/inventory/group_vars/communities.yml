## Communities VM. Hosts communities-service (handles POST /create-community).
## Previously co-located on the backend VM (127.0.0.1) alongside a separate
## create-community-service; that service has been folded back into
## communities-service.
communities_systemd_services:
  - discord-communities

communities_workspace_build_commands:
  - npm run build --workspace @discord/pubsub
  - npm run build --workspace communities-service

communities_nginx_conf_src: "{{ deploy_path }}/docs/nginx/production-communities.conf.example"

## /etc/discord.env values — used by communities-service
communities_log_level: info
communities_log_pretty: "true"
communities_database_url: "postgresql://postgres:123456789@10.0.2.247:6432/auth_db"
communities_redis_url: "redis://10.0.3.49:6379"
# pubsub2 (port 6381) — community:events publishes go here.
communities_meta_redis_url: "redis://10.0.3.49:6381"
# kv (port 6380) — sessions only.
communities_kv_redis_url: "redis://10.0.3.49:6380"
# kv2 (port 6382) — community read-cache (comm:e:*, comm:c:*).
communities_kv_cache_redis_url: "redis://10.0.3.49:6382"

communities_port: "3002"
communities_search_service_url: "http://10.0.2.26:3004"
