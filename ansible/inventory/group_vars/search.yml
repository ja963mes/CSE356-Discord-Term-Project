## Search VM (search-service only). Hosts must be in [search] inventory group.

## /etc/discord.env values for search-service
search_log_level: info
search_log_pretty: "true"
search_port: "3004"

search_database_url: "postgresql://postgres:123456789@10.0.2.247:6432/auth_db"
search_redis_url: "redis://10.0.3.49:6379"
# pubsub2 (port 6381) — search subscribes to community:events here.
search_meta_redis_url: "redis://10.0.3.49:6381"
# kv (port 6380) — sessions only.
search_kv_redis_url: "redis://10.0.3.49:6380"
# kv2 (port 6382) — comm:e:dir epoch counter.
search_kv_cache_redis_url: "redis://10.0.3.49:6382"
search_elasticsearch_url: "http://127.0.0.1:9200"
