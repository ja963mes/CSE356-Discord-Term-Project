- name: Configure Redis pubsub VM
  hosts: redis
  become: true
  roles:
    - redis

- name: Configure common deploy prerequisites
  hosts: all:!redis
  become: true
  roles:
    - common

- name: Configure Zabbix agent on managed VMs
  hosts: all
  become: true
  roles:
    - zabbix-agent

- name: Configure and deploy realtime VM
  hosts: realtime
  become: true
  roles:
    - realtime

- name: Configure and deploy messages VM
  hosts: messages
  become: true
  roles:
    - messages

- name: Configure and deploy dms VM
  hosts: dms
