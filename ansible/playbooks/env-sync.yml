# Sync /etc/discord.env on all service VMs from current group_vars, then restart.
# Run this after any rollback or manual IP change to re-converge all envs.
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini playbooks/env-sync.yml
#   ansible-playbook -i inventory/hosts.ini playbooks/env-sync.yml --limit realtime
#
- name: Sync env - realtime
  hosts: realtime
  become: true
  tasks:
    - ansible.builtin.template:
        src: "{{ deploy_path }}/ansible/roles/realtime/templates/discord.env.j2"
        dest: /etc/discord.env
        owner: root
        group: root
        mode: "0640"
    - ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ realtime_systemd_services }}"

