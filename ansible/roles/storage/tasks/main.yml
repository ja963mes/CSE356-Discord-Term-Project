- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc

- name: Add Docker apt repository
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
    > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure repo is checked out
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    update: true
    force: true
  become_user: "{{ deploy_user }}"

- name: Start MinIO via docker compose
  ansible.builtin.command: docker compose up -d minio
  args:
    chdir: "{{ deploy_path }}"

- name: Wait for MinIO port to be available
  ansible.builtin.wait_for:
    host: localhost
    port: 9000
    timeout: 60

- name: Check MinIO container is running
  ansible.builtin.command: docker inspect --format='{{ "{{" }}.State.Running{{ "}}" }}' discord-clone-minio
  register: minio_running
  changed_when: false
  failed_when: minio_running.stdout != 'true'
