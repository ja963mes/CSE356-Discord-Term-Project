- name: Install required packages for Redis repo
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Redis GPG key
  ansible.builtin.shell: |
    curl -fsSL https://packages.redis.io/gpg | gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/redis-archive-keyring.gpg

- name: Add Redis apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb {{ ansible_distribution_release }} main"
    state: present
    filename: redis

- name: Install redis-server 7.4.8
  ansible.builtin.apt:
    name:
      - "redis-server=6:7.4.8-1rl1~jammy1"
      - "redis-tools=6:7.4.8-1rl1~jammy1"
    state: present
    update_cache: true

- name: Configure Redis bind address
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^bind "
    line: "bind 127.0.0.1 {{ redis_bind_address }}"
  notify: restart redis

- name: Configure Redis port
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^port "
    line: "port {{ redis_port }}"
  notify: restart redis

- name: Disable protected mode
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^protected-mode"
    line: "protected-mode no"
  notify: restart redis

- name: Enable systemd supervision
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^supervised"
    line: "supervised systemd"
  notify: restart redis

- name: Configure Redis maxmemory
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^# maxmemory "
    line: "maxmemory {{ redis_maxmemory }}"
  notify: restart redis

- name: Configure Redis maxmemory-policy
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^# maxmemory-policy "
    line: "maxmemory-policy {{ redis_maxmemory_policy }}"
  notify: restart redis

- name: Enable and start redis-server
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started

- name: Verify redis is reachable
  ansible.builtin.command: redis-cli -h {{ redis_bind_address }} -p {{ redis_port }} ping
  changed_when: false
  register: redis_ping
  failed_when: redis_ping.stdout != "PONG"
