- name: Ensure frontend repo is checked out
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    update: true
    force: true
  become_user: "{{ deploy_user }}"

- name: Install frontend workspace dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"

- name: Build frontend workspace
  ansible.builtin.command: npm run build --workspace frontend
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"

- name: Ensure frontend web root exists
  ansible.builtin.file:
    path: "{{ frontend_web_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Sync frontend dist to web root
  ansible.posix.synchronize:
    src: "{{ deploy_path }}/frontend/dist/"
    dest: "{{ frontend_web_root }}/"
    delete: true
    recursive: true
  delegate_to: "{{ inventory_hostname }}"

- name: Ensure frontend web root permissions are readable by nginx
  ansible.builtin.file:
    path: "{{ frontend_web_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
    recurse: true

- name: Manage frontend nginx config files (optional)
  when: manage_nginx_config
  block:
    - name: Install frontend nginx config
      ansible.builtin.copy:
        src: "{{ frontend_nginx_conf_src }}"
        dest: /etc/nginx/sites-available/discord-frontend
        owner: root
        group: root
        mode: "0644"

    - name: Enable frontend nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/discord-frontend
        dest: /etc/nginx/sites-enabled/discord-frontend
        state: link
        force: true

    - name: Remove legacy default catch-all symlink if present
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default-catchall
        state: absent

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

- name: Ensure journald config dir exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journald size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/discord.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=300M
  notify: Restart journald

- name: Tighten nginx logrotate (cap access/error log growth)
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nginx
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/nginx/*.log {
              daily
              rotate 7
              maxsize 200M
              missingok
              notifempty
              compress
              delaycompress
              sharedscripts
              postrotate
                      if [ -f /var/run/nginx.pid ]; then
                              kill -USR1 `cat /var/run/nginx.pid`
                      fi
              endscript
      }

- name: Prune npm cache to reclaim disk after build
  ansible.builtin.command: npm cache clean --force
  become_user: "{{ deploy_user }}"
  changed_when: false

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
