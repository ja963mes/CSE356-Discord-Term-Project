- name: Ensure dms repo is checked out
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    update: true
    force: true
  become_user: "{{ deploy_user }}"

- name: Install workspace dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"

- name: Build dms workspace
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"
  loop: "{{ dms_workspace_build_commands }}"

- name: Manage dms systemd service files (optional)
  when: manage_systemd_services | default(false)
  block:
    - name: Install dms systemd unit files
      ansible.builtin.template:
        src: "{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ dms_systemd_services }}"
      register: dms_systemd_files_changed

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      when: dms_systemd_files_changed.changed

    - name: Enable dms services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop: "{{ dms_systemd_services }}"

- name: Install discord.env
  ansible.builtin.template:
    src: discord.env.j2
    dest: /etc/discord.env
    owner: root
    group: root
    mode: "0640"

- name: Manage dms nginx config files (optional)
  when: manage_nginx_config | default(false)
  block:
    - name: Install dms nginx config
      ansible.builtin.copy:
        src: "{{ dms_nginx_conf_src }}"
        dest: /etc/nginx/sites-available/discord-dms
        owner: root
        group: root
        mode: "0644"
        remote_src: true

    - name: Enable dms nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/discord-dms
        dest: /etc/nginx/sites-enabled/discord-dms
        state: link
        force: true

    - name: Disable default nginx site if present
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

- name: Restart dms services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ dms_systemd_services }}"

- name: Check dms services are active
  ansible.builtin.command: "systemctl is-active {{ item }}"
  changed_when: false
  loop: "{{ dms_systemd_services }}"
