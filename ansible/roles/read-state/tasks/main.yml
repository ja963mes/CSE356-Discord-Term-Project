- name: Ensure read-state repo is checked out
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    update: true
    force: true
  become_user: "{{ deploy_user }}"

- name: Install workspace dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"

- name: Build read-state workspace
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"
  loop: "{{ read_state_workspace_build_commands }}"

- name: Manage read-state systemd service files (optional)
  when: manage_systemd_services | default(false)
  block:
    - name: Install read-state systemd unit files
      ansible.builtin.template:
        src: "{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ read_state_systemd_services }}"
      register: read_state_systemd_files_changed

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      when: read_state_systemd_files_changed.changed

    - name: Enable read-state services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop: "{{ read_state_systemd_services }}"

- name: Install discord.env
  ansible.builtin.template:
    src: discord.env.j2
    dest: /etc/discord.env
    owner: root
    group: root
    mode: "0640"

- name: Ensure journald config dir exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journald size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/discord.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=300M
  notify: Restart journald

- name: Manage read-state nginx config files (optional)
  when: manage_nginx_config | default(false)
  block:
    - name: Install read-state nginx config
      ansible.builtin.copy:
        src: "{{ read_state_nginx_conf_src }}"
        dest: /etc/nginx/sites-available/discord-read-state
        owner: root
        group: root
        mode: "0644"
        remote_src: true

    - name: Enable read-state nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/discord-read-state
        dest: /etc/nginx/sites-enabled/discord-read-state
        state: link
        force: true

    - name: Disable default nginx site if present
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

- name: Restart read-state services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ read_state_systemd_services }}"

- name: Check read-state services are active
  ansible.builtin.command: "systemctl is-active {{ item }}"
  changed_when: false
  register: read_state_active_check
  until: read_state_active_check.rc == 0
  retries: 10
  delay: 3
  loop: "{{ read_state_systemd_services }}"
