- name: Ensure search repo is checked out
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    update: true
    force: true
  become_user: "{{ deploy_user }}"

- name: Install search workspace dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"

- name: Build search workspace
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"
  loop: "{{ search_workspace_build_commands }}"

- name: Manage systemd service files (optional, fixes path mismatches)
  when: manage_systemd_services | default(false)
  block:
    - name: Install search systemd service files
      ansible.builtin.template:
        src: "{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ search_systemd_services }}"
      register: systemd_files_changed

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      when: systemd_files_changed.changed

    - name: Enable search services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop: "{{ search_systemd_services }}"

- name: Install discord.env
  ansible.builtin.template:
    src: discord.env.j2
    dest: /etc/discord.env
    owner: root
    group: root
    mode: "0640"

- name: Restart search services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ search_systemd_services }}"

- name: Check search services are active
  ansible.builtin.command: "systemctl is-active {{ item }}"
  changed_when: false
  register: search_active_check
  until: search_active_check.rc == 0
  retries: 10
  delay: 3
  loop: "{{ search_systemd_services }}"
