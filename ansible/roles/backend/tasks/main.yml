- name: Ensure backend repo is checked out
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    update: true
    force: true
  become_user: "{{ deploy_user }}"

- name: Install backend workspace dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"

- name: Build backend workspaces
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"
  loop: "{{ backend_workspace_build_commands }}"

- name: Run database migrations (first backend host only)
  when: inventory_hostname == groups['backend'][0]
  block:
    - name: Execute Drizzle migrations
      ansible.builtin.command: npm run db:migrate
      args:
        chdir: "{{ deploy_path }}"
      become_user: "{{ deploy_user }}"
      register: migration_output

    - name: Display migration output
      ansible.builtin.debug:
        var: migration_output.stdout_lines
      when: migration_output.stdout_lines is defined and migration_output.stdout_lines | length > 0

- name: Manage backend nginx config files (optional)
  when: manage_nginx_config
  block:
    - name: Install backend nginx config
      ansible.builtin.copy:
        src: "{{ backend_nginx_conf_src }}"
        dest: /etc/nginx/sites-available/discord-backend
        owner: root
        group: root
        mode: "0644"

    - name: Enable backend nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/discord-backend
        dest: /etc/nginx/sites-enabled/discord-backend
        state: link
        force: true

    - name: Remove legacy combined nginx site symlink if present
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/discord-production
        state: absent

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

- name: Restart backend services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ backend_systemd_services }}"

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Check backend services are active
  ansible.builtin.command: "systemctl is-active {{ item }}"
  changed_when: false
  loop: "{{ backend_systemd_services }}"
