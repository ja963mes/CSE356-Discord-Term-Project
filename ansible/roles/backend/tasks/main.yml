- name: Ensure backend repo is checked out
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    update: true
    force: true
  become_user: "{{ deploy_user }}"

- name: Install backend workspace dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"

- name: Build backend workspaces
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ deploy_user }}"
  loop:
    - npm run build --workspace auth-service
    - npm run build --workspace search-service
    - npm run build --workspace communities-service
    - npm run build --workspace create-community-service
    - npm run build --workspace messages-service
    - npm run build --workspace realtime-service
    - npm run build --workspace dms-service
    - npm run build --workspace read-state-service

- name: Install backend nginx config
  ansible.builtin.copy:
    src: "{{ backend_nginx_conf_src }}"
    dest: /etc/nginx/sites-available/discord-backend
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable backend nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/discord-backend
    dest: /etc/nginx/sites-enabled/discord-backend
    state: link
    force: true
  notify: Reload nginx

- name: Remove legacy combined nginx site symlink if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/discord-production
    state: absent
  notify: Reload nginx

- name: Restart backend services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ backend_systemd_services }}"
