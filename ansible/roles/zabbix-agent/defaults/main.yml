manage_zabbix_agent: false

zabbix_agent_repo_version: "7.0"
zabbix_agent_package: "zabbix-agent2"
zabbix_agent_service_name: "zabbix-agent2"

# Required when enabling the role.
zabbix_agent_server: ""
zabbix_agent_server_active: "{{ zabbix_agent_server }}"

zabbix_agent_hostname: "{{ inventory_hostname }}"
zabbix_agent_hostmetadata: "discord {{ group_names | join(',') }}"
zabbix_agent_listen_port: 10050
zabbix_agent_timeout: 10
zabbix_agent_refresh_active_checks: 120
zabbix_agent_buffer_send: 5
zabbix_agent_buffer_size: 100
zabbix_agent_log_file: /var/log/zabbix/zabbix_agent2.log
zabbix_agent_log_file_size: 10

zabbix_agent_release_deb: >-
  https://repo.zabbix.com/zabbix/{{ zabbix_agent_repo_version }}/ubuntu/pool/main/z/zabbix-release/
  zabbix-release_latest_{{ zabbix_agent_repo_version }}+ubuntu{{ ansible_distribution_version }}_all.deb

# Redis plugin sessions — only the redis VM sets this (see group_vars/redis.yml).
# Each entry: { name: <session>, uri: tcp://host:port, password: optional }.
zabbix_agent_redis_sessions: []
